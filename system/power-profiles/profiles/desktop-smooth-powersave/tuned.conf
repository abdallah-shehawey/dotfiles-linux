[main]
summary=Power saving with responsive interactive CPU bursts
include=powersave

[variables]
desktop_smooth_platform_profile=low-power|quiet

[cpu]
governor=schedutil|ondemand|powersave
energy_perf_bias=normal
energy_performance_preference=balance_performance
boost=1

[acpi]
enabled=false

[platform_profile]
type=script
script=/etc/tuned/profiles/desktop-smooth-common/platform-profile.sh

[video]
panel_power_savings=1
