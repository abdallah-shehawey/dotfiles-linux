# DXVK settings for PES 2019: the shared ones from dxvk.conf, plus its own below
dxgi.maxFrameLatency = 1
d3d9.maxFrameLatency = 1
dxgi.syncInterval = 1
dxgi.maxFrameRate = -1
d3d9.presentInterval = 1

# By default DXVK reports the RTX as an AMD card; PES 2019 then never creates
# its swapchain and the window stays white forever
dxgi.hideNvidiaGpu = False
